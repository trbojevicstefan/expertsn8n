runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
    availability: [ RUNTIME ]

  # Browser Firebase config - inlined at build time, also present at runtime.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAKMwdvKUWy1MchnKRaARH_YX4nwXUqjYM
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: studio-7677538569-60fbd.firebaseapp.com
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studio-7677538569-60fbd
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: studio-7677538569-60fbd.firebasestorage.app
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "932762026628"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:932762026628:web:b5686c5c1d618ec9d8b8d1
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_APP_URL
    value: https://n8nexperts--studio-7677538569-60fbd.us-central1.hosted.app
    availability: [ BUILD, RUNTIME ]

  # Server runtime - Admin SDK uses the App Hosting compute service account.
  - variable: FIREBASE_PROJECT_ID
    value: studio-7677538569-60fbd
    availability: [ RUNTIME ]
  - variable: FIREBASE_STORAGE_BUCKET
    value: studio-7677538569-60fbd.firebasestorage.app
    availability: [ RUNTIME ]
  - variable: SESSION_COOKIE_NAME
    value: n8nexperts_session
    availability: [ RUNTIME ]
  - variable: SESSION_COOKIE_DAYS
    value: "5"
    availability: [ RUNTIME ]

  # Customer.io Track API credentials are stored in Google Secret Manager.
  - variable: CUSTOMERIO_SITE_ID
    secret: CUSTOMERIO_SITE_ID
    availability: [ RUNTIME ]
  - variable: CUSTOMERIO_TRACK_API_KEY
    secret: CUSTOMERIO_TRACK_API_KEY
    availability: [ RUNTIME ]
  - variable: CUSTOMERIO_REGION
    value: us
    availability: [ RUNTIME ]

  - variable: PAYMENT_PROVIDER
    value: mock
    availability: [ RUNTIME ]
  - variable: PLATFORM_FEE_BPS
    value: "1000"
    availability: [ RUNTIME ]
  - variable: CUSTOMERIO_APP_API_KEY
    secret: CUSTOMERIO_APP_API_KEY
    availability: [ RUNTIME ]
  - variable: CUSTOMERIO_TRANSACTIONAL_MESSAGE_ID
    value: platform_message_notification
    availability: [ RUNTIME ]
  - variable: CUSTOMERIO_CRON_SECRET
    secret: CUSTOMERIO_CRON_SECRET
    availability: [ RUNTIME ]
